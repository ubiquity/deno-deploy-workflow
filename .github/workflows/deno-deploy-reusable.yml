name: Reusable - Deno Deploy

on:
  workflow_call:
    inputs:
      project:
        description: Optional Deno Deploy project name for production (defaults to derived from repository name)
        required: false
        type: string
        default: ""
      preview_project:
        description: Optional preview project name (defaults to "preview-<project>")
        required: false
        type: string
        default: ""
      entrypoint:
        description: Entrypoint file passed to Deno Deploy (relative to root)
        required: true
        type: string
      root:
        description: Directory to deploy from
        required: false
        type: string
        default: "."
      artifact_name:
        description: Optional artifact name to download and deploy from
        required: false
        type: string
        default: ""
      artifact_run_id:
        description: Workflow run id that produced the artifact (required when artifact_name is set)
        required: false
        type: string
        default: ""
      artifact_path:
        description: Local path to download artifact into
        required: false
        type: string
        default: ".deploy-artifact"
      deno_version:
        description: Deno version range
        required: false
        type: string
        default: v2.x
      deployctl_version:
        description: deployctl version to install for Deploy Classic
        required: false
        type: string
        default: "1.13.1"
      deploy_platform:
        description: Deployment backend. Use "classic" for deployctl/.deno.dev or "deno2" for deno deploy/.deno.net.
        required: false
        type: string
        default: classic
      deno_org:
        description: Deno Deploy organization name for deploy_platform=deno2
        required: false
        type: string
        default: ubiquity-dao
      deno_region:
        description: Deno Deploy region for app creation when deploy_platform=deno2
        required: false
        type: string
        default: global
      deno_build_timeout:
        description: Deno Deploy build timeout in minutes for deploy_platform=deno2
        required: false
        type: string
        default: "5"
      deno_build_memory_limit:
        description: Deno Deploy build memory in MB for deploy_platform=deno2
        required: false
        type: string
        default: "1024"
      install_command:
        description: Optional install command (multi-line allowed)
        required: false
        type: string
        default: ""
      build_command:
        description: Optional build command (multi-line allowed)
        required: false
        type: string
        default: ""
      node_version:
        description: Set to install Node.js (empty to skip)
        required: false
        type: string
        default: ""
      bun_version:
        description: Set to install Bun (empty to skip)
        required: false
        type: string
        default: ""
      include:
        description: Newline-separated include globs for deployctl/artifact packaging
        required: false
        type: string
        default: ""
      exclude:
        description: Newline-separated exclude globs for deployctl/artifact packaging
        required: false
        type: string
        default: |
          .git
          .github
          node_modules
          dist
          build
          coverage
          .turbo
          .next
          .vercel
      env_var_keys:
        description: Newline-separated env var names to forward as --env
        required: false
        type: string
        default: ""
      env_var_keys_fork:
        description: Newline-separated env var names to forward as --env for forked PR previews
        required: false
        type: string
        default: ""
      runtime_env:
        description: Newline-separated KEY=VALUE lines to forward as --env (preferred)
        required: false
        type: string
        default: ""
      runtime_env_fork:
        description: Newline-separated KEY=VALUE lines to forward as --env for forked PR previews
        required: false
        type: string
        default: ""
      build_env:
        description: Newline-separated KEY=VALUE lines to export before install/build
        required: false
        type: string
        default: ""
      forward_all_secrets:
        description: Forward all available GitHub secrets as runtime env vars (dangerous; opt-in)
        required: false
        type: boolean
        default: false
      allow_fork_secrets:
        description: Allow forked PR previews to use runtime env/secrets (unsafe; default false)
        required: false
        type: boolean
        default: false
      forward_all_secrets_exclude:
        description: Newline-separated secret names to exclude when forward_all_secrets is true
        required: false
        type: string
        default: |
          DENO_DEPLOY_TOKEN
          GITHUB_TOKEN
      ensure_project:
        description: Ensure the target project exists via Deno Deploy API before deploying
        required: false
        type: boolean
        default: true
      project_secrets:
        description: Newline-separated SECRET_NAME=ENV_VAR mappings to persist as Deno Deploy secrets (production and fallback)
        required: false
        type: string
        default: ""
      project_secrets_fork:
        description: Optional SECRET_NAME=ENV_VAR mappings for forked PR previews
        required: false
        type: string
        default: ""
      preview_project_secrets:
        description: Optional SECRET_NAME=ENV_VAR mappings for preview deployments (overrides project_secrets)
        required: false
        type: string
        default: ""
      preview_project_secrets_fork:
        description: Optional SECRET_NAME=ENV_VAR mappings for forked PR previews (overrides project_secrets_fork)
        required: false
        type: string
        default: ""
      required_env:
        description: Newline-separated env vars that must be present to deploy
        required: false
        type: string
        default: |
          DENO_DEPLOY_TOKEN
      submodules:
        description: Submodules checkout mode (empty to skip, 'recursive' for recursive)
        required: false
        type: string
        default: ""
      verify_url:
        description: Probe the deployed URL after deploy
        required: false
        type: boolean
        default: true
      index_html_path:
        description: Path to index.html for extracting static asset paths (relative to root)
        required: false
        type: string
        default: ""
      extra_paths:
        description: Optional newline-separated additional paths to test (e.g., API endpoints)
        required: false
        type: string
        default: ""
      debug_fetch_paths:
        description: Optional newline-separated URLs or paths (relative to deployed base URL) to GET after deploy for debugging (overrides dynamic extraction)
        required: false
        type: string
        default: ""
      debug_fetch_fail:
        description: Fail the workflow if any debug fetch returns a non-2xx/3xx status
        required: false
        type: boolean
        default: false
      create_preview:
        description: Create preview project when missing
        required: false
        type: boolean
        default: true
      deno2_quota_gc:
        description: Delete one generated Deno 2 preview/branch app and retry when app creation fails due to app quota
        required: false
        type: boolean
        default: true
      deno2_quota_gc_protected_apps:
        description: Newline-separated Deno 2 app slugs that quota GC must never delete
        required: false
        type: string
        default: ""
      deno2_quota_gc_candidate_prefixes:
        description: Newline-separated app slug prefixes that quota GC may delete
        required: false
        type: string
        default: ""
      comment_pr:
        description: Post/update a deployment comment on pull requests
        required: false
        type: boolean
        default: true
      prod_branch:
        description: Branch name for production deployments
        required: false
        type: string
        default: ""
    secrets:
      DENO_DEPLOY_TOKEN:
        required: true
      SUPABASE_URL:
        required: false
      SUPABASE_ANON_KEY:
        required: false
      SUPABASE_SERVICE_ROLE_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      CODEX_AUTH_JSON_B64:
        required: false
      CODEX_INSTRUCTIONS_B64:
        required: false
      UBIQUITY_AI_USER_TOKEN:
        required: false
      UBIQUITY_AI_ADMIN_TOKEN:
        required: false
      OPENAI_BASE_URL:
        required: false
      CODEX_BASE_URL:
        required: false
      CORS_ALLOW_ORIGIN:
        required: false
      DENO_PROJECT_SECRETS:
        required: false
      DENO_PREVIEW_PROJECT_SECRETS:
        required: false

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  deploy:
    name: Deno Deploy
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    concurrency:
      group: deno-deploy-${{ inputs.project }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
      cancel-in-progress: true
    env:
      PROD_BRANCH: ${{ inputs.prod_branch != '' && inputs.prod_branch || github.event.repository.default_branch }}
      PROJECT: ${{ inputs.project }}
      PREVIEW_PROJECT: ${{ inputs.preview_project }}
      ENTRYPOINT: ${{ inputs.entrypoint }}
      ROOT_DIR: ${{ inputs.root }}
      ARTIFACT_NAME: ${{ inputs.artifact_name }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      ARTIFACT_PATH: ${{ inputs.artifact_path }}
      INCLUDE: ${{ inputs.include }}
      EXCLUDE: ${{ inputs.exclude }}
      RUNTIME_ENV_KEYS: ${{ inputs.env_var_keys }}
      RUNTIME_ENV_KEYS_FORK: ${{ inputs.env_var_keys_fork }}
      RUNTIME_ENV: ${{ inputs.runtime_env }}
      RUNTIME_ENV_FORK: ${{ inputs.runtime_env_fork }}
      BUILD_ENV: ${{ inputs.build_env }}
      FORWARD_ALL_SECRETS: ${{ inputs.forward_all_secrets }}
      ALLOW_FORK_SECRETS: ${{ inputs.allow_fork_secrets }}
      FORWARD_ALL_SECRETS_EXCLUDE: ${{ inputs.forward_all_secrets_exclude }}
      ENSURE_PROJECT: ${{ inputs.ensure_project }}
      PROJECT_SECRETS: ${{ inputs.project_secrets != '' && inputs.project_secrets || secrets.DENO_PROJECT_SECRETS || '' }}
      PROJECT_SECRETS_FORK: ${{ inputs.project_secrets_fork }}
      PREVIEW_PROJECT_SECRETS: ${{ inputs.preview_project_secrets != '' && inputs.preview_project_secrets || secrets.DENO_PREVIEW_PROJECT_SECRETS || '' }}
      PREVIEW_PROJECT_SECRETS_FORK: ${{ inputs.preview_project_secrets_fork }}
      REQUIRED_ENV: ${{ inputs.required_env }}
      BUILD_COMMAND: ${{ inputs.build_command }}
      INSTALL_COMMAND: ${{ inputs.install_command }}
      CREATE_PREVIEW: ${{ inputs.create_preview }}
      DENO2_QUOTA_GC: ${{ inputs.deno2_quota_gc }}
      DENO2_QUOTA_GC_PROTECTED_APPS: ${{ inputs.deno2_quota_gc_protected_apps }}
      DENO2_QUOTA_GC_CANDIDATE_PREFIXES: ${{ inputs.deno2_quota_gc_candidate_prefixes }}
      VERIFY_URL: ${{ inputs.verify_url }}
      COMMENT_PR: ${{ inputs.comment_pr }}
      INDEX_HTML_PATH: ${{ inputs.index_html_path }}
      EXTRA_PATHS: ${{ inputs.extra_paths }}
      DEBUG_FETCH_PATHS_INPUT: ${{ inputs.debug_fetch_paths }}
      DEBUG_FETCH_FAIL: ${{ inputs.debug_fetch_fail }}
      DENO_VERSION: ${{ inputs.deno_version }}
      DEPLOYCTL_VERSION: ${{ inputs.deployctl_version }}
      DEPLOY_PLATFORM: ${{ inputs.deploy_platform }}
      DENO_DEPLOY_ORG: ${{ inputs.deno_org }}
      DENO_DEPLOY_REGION: ${{ inputs.deno_region }}
      DENO_BUILD_TIMEOUT: ${{ inputs.deno_build_timeout }}
      DENO_BUILD_MEMORY_LIMIT: ${{ inputs.deno_build_memory_limit }}
      NODE_VERSION: ${{ inputs.node_version }}
      BUN_VERSION: ${{ inputs.bun_version }}
      DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
      # Prefer org/global vars when present so shared values stay consistent across repos,
      # while still allowing repo-specific secrets to override.
      SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL || '' }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || '' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ vars.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
      # Optional AI gateway/proxy env (only forwarded when requested via env_var_keys/runtime_env)
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || vars.OPENAI_API_KEY || '' }}
      CODEX_AUTH_JSON_B64: ${{ secrets.CODEX_AUTH_JSON_B64 || vars.CODEX_AUTH_JSON_B64 || '' }}
      CODEX_INSTRUCTIONS_B64: ${{ secrets.CODEX_INSTRUCTIONS_B64 || vars.CODEX_INSTRUCTIONS_B64 || '' }}
      UBIQUITY_AI_USER_TOKEN: ${{ secrets.UBIQUITY_AI_USER_TOKEN || vars.UBIQUITY_AI_USER_TOKEN || '' }}
      UBIQUITY_AI_ADMIN_TOKEN: ${{ secrets.UBIQUITY_AI_ADMIN_TOKEN || vars.UBIQUITY_AI_ADMIN_TOKEN || '' }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || secrets.OPENAI_BASE_URL || '' }}
      CODEX_BASE_URL: ${{ vars.CODEX_BASE_URL || secrets.CODEX_BASE_URL || '' }}
      CORS_ALLOW_ORIGIN: ${{ vars.CORS_ALLOW_ORIGIN || secrets.CORS_ALLOW_ORIGIN || '' }}
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: ${{ inputs.submodules }}

      - name: Detect fork context
        id: fork
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REPO: ${{ github.repository }}
          HEAD_REPO_PR: ${{ github.event.pull_request.head.repo.full_name || '' }}
          HEAD_REPO_RUN: ${{ github.event.workflow_run.head_repository.full_name || '' }}
        run: |
          set -euo pipefail
          is_fork=false
          case "$EVENT_NAME" in
            pull_request)
              if [ -n "$HEAD_REPO_PR" ] && [ "$HEAD_REPO_PR" != "$BASE_REPO" ]; then
                is_fork=true
              fi
              ;;
            workflow_run)
              if [ -n "$HEAD_REPO_RUN" ] && [ "$HEAD_REPO_RUN" != "$BASE_REPO" ]; then
                is_fork=true
              fi
              ;;
          esac
          echo "is_fork=$is_fork" >> "$GITHUB_OUTPUT"
          echo "IS_FORK=$is_fork" >> "$GITHUB_ENV"

      - name: Apply fork-safe env overrides
        if: env.IS_FORK == 'true' && env.ALLOW_FORK_SECRETS != 'true'
        run: |
          set -euo pipefail
          {
            echo "RUNTIME_ENV_KEYS<<EOF"
            echo "$RUNTIME_ENV_KEYS_FORK"
            echo "EOF"
            echo "RUNTIME_ENV<<EOF"
            echo "$RUNTIME_ENV_FORK"
            echo "EOF"
            echo "PROJECT_SECRETS<<EOF"
            echo "$PROJECT_SECRETS_FORK"
            echo "EOF"
            echo "PREVIEW_PROJECT_SECRETS<<EOF"
            echo "$PREVIEW_PROJECT_SECRETS_FORK"
            echo "EOF"
            echo "FORWARD_ALL_SECRETS=false"
          } >> "$GITHUB_ENV"

      - name: Validate artifact inputs
        if: env.ARTIFACT_NAME != ''
        run: |
          set -euo pipefail
          if [ -z "$ARTIFACT_RUN_ID" ]; then
            echo "::error::artifact_run_id is required when artifact_name is set"
            exit 1
          fi

      - name: Download deploy artifact
        if: env.ARTIFACT_NAME != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_PATH }}
          run-id: ${{ env.ARTIFACT_RUN_ID }}
          repository: ${{ github.repository }}

      - name: Use artifact as deploy root
        if: env.ARTIFACT_NAME != ''
        run: |
          set -euo pipefail
          echo "ROOT_DIR=$ARTIFACT_PATH" >> "$GITHUB_ENV"

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Set up Node.js (optional)
        if: env.NODE_VERSION != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Default Bun version (auto-detect)
        run: |
          set -euo pipefail
          if [ -n "${BUN_VERSION:-}" ]; then
            exit 0
          fi

          if printf '%s\n%s\n' "$INSTALL_COMMAND" "$BUILD_COMMAND" | grep -q 'bun '; then
            echo "BUN_VERSION=1.3.x" >> "$GITHUB_ENV"
            echo "Detected bun usage; defaulting BUN_VERSION=1.3.x"
          fi

      - name: Install Bun (optional)
        if: env.BUN_VERSION != ''
        run: |
          set -euo pipefail
          # Use the official install script to avoid setup-bun cache/download flakes.
          BUN_VERSION="${BUN_VERSION}" curl -fsSL https://bun.sh/install | bash
          echo "${HOME}/.bun/bin" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          set -euo pipefail
          deno --version
          if command -v node >/dev/null 2>&1; then node -v; fi
          if command -v bun >/dev/null 2>&1; then bun --version; fi

      - name: Install deployctl
        if: env.DEPLOY_PLATFORM == 'classic'
        run: |
          set -euo pipefail
          deno install -gArf jsr:@deno/deployctl@${{ env.DEPLOYCTL_VERSION }}
          echo "${HOME}/.deno/bin" >> "$GITHUB_PATH"

      - name: Preflight (token and required env)
        id: preflight
        run: |
          set -euo pipefail
          case "${DEPLOY_PLATFORM:-classic}" in
            classic|deno2) ;;
            *)
              echo "::error::deploy_platform must be 'classic' or 'deno2'. Got: ${DEPLOY_PLATFORM}"
              exit 1
              ;;
          esac
          if [ "${DEPLOY_PLATFORM:-classic}" = "deno2" ] && [ -z "${DENO_DEPLOY_ORG:-}" ]; then
            echo "::error::deno_org is required when deploy_platform=deno2"
            exit 1
          fi

          missing=()
          while IFS= read -r key; do
            key=$(echo "$key" | tr -d '\r' | xargs)
            [ -z "$key" ] && continue
            if [ -z "${!key:-}" ]; then
              missing+=("$key")
            fi
          done <<< "$REQUIRED_ENV"

          if [ ${#missing[@]} -gt 0 ]; then
            echo "deploy=no" >> "$GITHUB_OUTPUT"
            {
              echo "### Deno Deploy"
              echo ""
              echo "- Skipped: missing env vars -> ${missing[*]}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "deploy=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine target project
        if: steps.preflight.outputs.deploy == 'yes'
        id: target
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event || '' }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
        run: |
          set -euo pipefail
          project="${PROJECT:-}"
          if [[ "$project" != *-ubq-fi ]]; then
            echo "::error::Project name must end with '-ubq-fi' to match router mapping. Got: $project"
            exit 1
          fi
          if ! [[ "$project" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]]; then
            echo "::error::Project name must be DNS-safe (lowercase letters, numbers, hyphens; no leading/trailing hyphen). Got: $project"
            exit 1
          fi
          if [ ${#project} -gt 26 ]; then
            echo "::error::Base project name '${project}' exceeds 26 characters (Deno Deploy's max project name character limit)"
            exit 1
          fi

          preview="${PREVIEW_PROJECT:-}"
          if [ -z "$preview" ]; then
            base="${project%-ubq-fi}"
            # Clamp base to keep preview <=26 with prefix/suffix: p- + base + -ubq-fi
            if [ ${#base} -gt 17 ]; then
              # 12 chars + dash + 4-char hash = 17
              hash=$(printf '%s' "$base" | sha1sum | cut -c1-4)
              base="${base:0:12}-${hash}"
            fi
            preview="p-${base}-ubq-fi"
          fi

          if [ ${#preview} -gt 26 ]; then
            echo "::error::Preview project name '${preview}' exceeds 26 characters (Deno Deploy's max project name character limit)"
            exit 1
          fi
          if ! [[ "$preview" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]]; then
            echo "::error::Preview project name must be DNS-safe (lowercase letters, numbers, hyphens; no leading/trailing hyphen). Got: $preview"
            exit 1
          fi

          ref_name="${REF_NAME:-}"
          if [ "$EVENT_NAME" = "workflow_run" ] && [ -n "$HEAD_BRANCH" ]; then
            ref_name="$HEAD_BRANCH"
          fi

          mode="preview"
          target="$preview"
          if [ "$EVENT_NAME" = "workflow_run" ] && [ "$WORKFLOW_EVENT" = "pull_request" ]; then
            :
          elif [ "$ref_name" = "$PROD_BRANCH" ]; then
            mode="production"
            target="$project"
          fi

          {
            echo "mode=$mode"
            echo "project=$target"
            echo "preview_project=$preview"
          } >> "$GITHUB_OUTPUT"

      - name: Export build env
        if: steps.preflight.outputs.deploy == 'yes' && env.BUILD_ENV != '' && env.ARTIFACT_NAME == ''
        run: |
          set -euo pipefail
          printf '%s\n' "$BUILD_ENV" | envsubst >> "$GITHUB_ENV"

      - name: Validate Supabase env
        if: steps.preflight.outputs.deploy == 'yes'
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Supabase env vars are required but missing (SUPABASE_URL/SUPABASE_ANON_KEY)"
            exit 1
          fi
          if ! printf '%s' "$SUPABASE_URL" | grep -Eq '^https?://'; then
            echo "::error::SUPABASE_URL must be an http(s) URL"
            exit 1
          fi

      - name: Install dependencies
        if: steps.preflight.outputs.deploy == 'yes' && env.INSTALL_COMMAND != '' && env.ARTIFACT_NAME == ''
        run: |
          set -euo pipefail
          printf '%s\n' "$INSTALL_COMMAND" | bash

      - name: Build
        if: steps.preflight.outputs.deploy == 'yes' && env.BUILD_COMMAND != '' && env.ARTIFACT_NAME == ''
        run: |
          set -euo pipefail
          printf '%s\n' "$BUILD_COMMAND" | bash

      - name: "Guard: unresolved env placeholders"
        if: steps.preflight.outputs.deploy == 'yes'
        run: |
          set -euo pipefail
          collect_keys() {
            awk '
              /^[A-Za-z_][A-Za-z0-9_]*=/ { sub(/=.*/, "", $0); print $0 }
              /^[A-Za-z_][A-Za-z0-9_]*$/ { print $0 }
            '
          }

          keys="$(
            {
              printf '%s\n' "$BUILD_ENV"
              printf '%s\n' "$RUNTIME_ENV"
              printf '%s\n' "$RUNTIME_ENV_KEYS"
              printf '%s\n' "$REQUIRED_ENV"
            } | collect_keys | sort -u
          )"

          # Fallback to Supabase keys if nothing parsed (should not happen)
          if [ -z "$keys" ]; then
            keys="SUPABASE_URL SUPABASE_ANON_KEY"
          fi

          search_terms=()
          for k in $keys; do
            search_terms+=("\$$k")
            search_terms+=("\${$k}")
          done

          candidate_dirs=(static dist out public frontend/dist build)
          matches=""

          for term in "${search_terms[@]}"; do
            for d in "${candidate_dirs[@]}"; do
              dir="${ROOT_DIR}/${d}"
              [ -d "$dir" ] || continue
              found=$(rg --no-config --fixed-strings --no-heading --line-number "$term" "$dir" || true)
              if [ -n "$found" ]; then
                matches+=$'\n'"${d}:"
                matches+=$'\n'"$found"
              fi
            done
          done

          if [ -n "$matches" ]; then
            echo "::error::Detected unresolved env placeholders in built assets. This usually means one of the expected env vars was empty when building. Populate the missing values (see below) and rerun."
            printf '%s\n' "$matches"
            exit 1
          fi

      - name: Resolve index.html path
        if: steps.preflight.outputs.deploy == 'yes'
        run: |
          set -euo pipefail
          requested="${INDEX_HTML_PATH:-}"
          index_file=""

          # Prefer explicit input when it exists
          if [ -n "$requested" ] && [ -f "${ROOT_DIR}/${requested}" ]; then
            index_file="${ROOT_DIR}/${requested}"
          elif [ -n "$requested" ]; then
            echo "::warning::Requested index_html_path '${requested}' not found under ${ROOT_DIR}"
          fi

          # Autodiscover common build outputs if not already resolved
          if [ -z "$index_file" ]; then
            for rel in \
              "static/index.html" \
              "public/index.html" \
              "frontend/dist/index.html" \
              "dist/index.html" \
              "out/index.html" \
              "src/client/dashboard/index.html" \
              "src/index.html" \
              "index.html"
            do
              if [ -f "${ROOT_DIR}/${rel}" ]; then
                index_file="${ROOT_DIR}/${rel}"
                break
              fi
            done
          fi

          # Final fallback: generic search, excluding heavy dirs
          if [ -z "$index_file" ]; then
            index_file=$(find "${ROOT_DIR}" \
              -maxdepth 5 \
              \( -path "*/node_modules/*" -o -path "*/.git/*" -o -path "*/.next/*" -o -path "*/.turbo/*" -o -path "*/.vercel/*" \) -prune \
              -o -name index.html -print | head -n 1 || true)
          fi

          if [ -n "$index_file" ]; then
            echo "INDEX_HTML_RESOLVED=${index_file}" >> "$GITHUB_ENV"
            echo "Using index.html at ${index_file}"
          else
            echo "INDEX_HTML_RESOLVED=" >> "$GITHUB_ENV"
            echo "::warning::No index.html found; debug fetch will only use extra/manual paths"
          fi

      - name: Build debug fetch paths
        if: steps.preflight.outputs.deploy == 'yes'
        run: |
          set -euo pipefail
          manual_paths="${DEBUG_FETCH_PATHS_INPUT:-}"
          index_file="${INDEX_HTML_RESOLVED:-}"
          paths="/"

          if [ -n "$index_file" ] && [ -f "$index_file" ]; then
            # Extract paths from href and src attributes (supports single and double quotes)
            extracted=$(grep -oE "href=([\"'])([^\"']*)\\1" "$index_file" | sed -E "s/href=([\"'])([^\"']*)\\1/\\2/" | grep -v '^http' | sed 's|^[^/]|/&|')
            extracted="$extracted"$'\n'$(grep -oE "src=([\"'])([^\"']*)\\1" "$index_file" | sed -E "s/src=([\"'])([^\"']*)\\1/\\2/" | grep -v '^http' | sed 's|^[^/]|/&|')
            paths="$paths"$'\n'"$extracted"
          elif [ -n "$index_file" ]; then
            echo "::warning::Index HTML not found at ${index_file}; debug fetch will use extras/manual paths only"
          fi

          if [ -n "$EXTRA_PATHS" ]; then
            paths="$paths"$'\n'"$EXTRA_PATHS"
          fi

          if [ -n "$manual_paths" ]; then
            paths="$paths"$'\n'"$manual_paths"
          fi

          paths=$(printf '%s\n' "$paths" | tr -d '\r' | while IFS= read -r p; do
            [ -z "$p" ] && continue
            case "$p" in
              http://*|https://*|//*) printf '%s\n' "$p" ;;
              /*) printf '%s\n' "$p" ;;
              *) printf '/%s\n' "$p" ;;
            esac
          done | sort -u | sed '/^$/d')

          {
            echo "DEBUG_FETCH_PATHS<<EOF"
            echo "$paths"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Forward all GitHub secrets (runtime)
        if: steps.preflight.outputs.deploy == 'yes' && env.FORWARD_ALL_SECRETS == 'true'
        env:
          ALL_SECRETS_JSON: ${{ toJson(secrets) }}
        run: |
          set -euo pipefail

          tmp_out="$(mktemp)"
          python - <<'PY' > "$tmp_out"
          import json, os, re

          raw = os.environ.get("ALL_SECRETS_JSON", "") or "{}"
          try:
              data = json.loads(raw)
          except Exception:
              data = {}

          exclude = {
              k.strip()
              for k in (os.environ.get("FORWARD_ALL_SECRETS_EXCLUDE", "") or "").splitlines()
              if k.strip()
          }
          valid = re.compile(r"^[A-Za-z_][A-Za-z0-9_]*$")

          lines = []
          for k, v in data.items():
              if k in exclude:
                  continue
              if not valid.match(k):
                  continue
              if v is None:
                  continue
              v = str(v)
              if not v:
                  continue
              if "\n" in v or "\r" in v:
                  continue
              lines.append(f"{k}={v}")

          print("\n".join(lines), end="")
          PY

          extra_runtime="$(cat "$tmp_out")"
          rm -f "$tmp_out"
          [ -z "$extra_runtime" ] && exit 0

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            echo "::add-mask::${line#*=}"
          done <<< "$extra_runtime"

          combined="$(printf '%s\n' "$RUNTIME_ENV" "$extra_runtime" | tr -d '\r' | sed '/^$/d')"
          {
            echo "RUNTIME_ENV<<EOF"
            echo "$combined"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Ensure project exists and sync secrets
        if: steps.preflight.outputs.deploy == 'yes'
        env:
          MODE: ${{ steps.target.outputs.mode }}
          TARGET_PROJECT: ${{ steps.target.outputs.project }}
          RESOLVED_PREVIEW_PROJECT: ${{ steps.target.outputs.preview_project }}
        run: |
          set -euo pipefail
          project="${TARGET_PROJECT:-}"
          mode="${MODE:-}"
          if [ -z "$project" ]; then
            echo "::error::Target project was not resolved"
            exit 1
          fi

          secrets_block="$PROJECT_SECRETS"
          if [ "$mode" = "preview" ] && [ -n "$PREVIEW_PROJECT_SECRETS" ]; then
            secrets_block="$PREVIEW_PROJECT_SECRETS"
          fi

          if [ -n "$secrets_block" ]; then
            if [ "${DEPLOY_PLATFORM:-classic}" = "classic" ]; then
              echo "::warning::project_secrets persistence via dash.deno.com API is no longer supported; forwarding these as runtime env for this deploy only."
            else
              echo "Syncing project_secrets mappings as Deno Deploy app env."
            fi

            extra_runtime=""
            while IFS= read -r line; do
              line=$(echo "$line" | tr -d '\r' | xargs)
              [ -z "$line" ] && continue
              if ! printf '%s\n' "$line" | grep -q '='; then
                echo "::warning::project_secrets line missing '=': $line"
                continue
              fi
              secret_name=${line%%=*}
              env_key=${line#*=}
              if [ -z "$secret_name" ] || [ -z "$env_key" ]; then
                echo "::warning::project_secrets line invalid: $line"
                continue
              fi
              val="${!env_key:-}"
              if [ -z "$val" ]; then
                echo "::warning::Secret $secret_name skipped because env $env_key is empty"
                continue
              fi
              echo "::add-mask::$val"
              extra_runtime+=$'\n'"${secret_name}=${val}"
            done <<< "$secrets_block"

            if [ -n "$extra_runtime" ]; then
              combined="$(printf '%s\n' "$RUNTIME_ENV" "$extra_runtime" | tr -d '\r' | sed '/^$/d')"
              {
                echo "RUNTIME_ENV<<EOF"
                echo "$combined"
                echo "EOF"
              } >> "$GITHUB_ENV"
              RUNTIME_ENV="$combined"
            fi
          fi

          if [ "${DEPLOY_PLATFORM:-classic}" = "deno2" ]; then
            set +e
            probe_output="$(deno deploy env list --token "$DENO_DEPLOY_TOKEN" --org "$DENO_DEPLOY_ORG" --app "$project" 2>&1)"
            probe_status=$?
            set -e

            if [ $probe_status -eq 0 ]; then
              echo "Deno Deploy app $project already exists."
            elif printf '%s\n' "$probe_output" | grep -qi "not found"; then
              if [ "$ENSURE_PROJECT" != "true" ]; then
                echo "::error::Deno Deploy app $project not found and ensure_project is false"
                printf '%s\n' "$probe_output"
                exit 1
              fi

              create_flags=(
                "--token=$DENO_DEPLOY_TOKEN"
                "--org=$DENO_DEPLOY_ORG"
                "--app=$project"
                "--source=local"
                "--do-not-use-detected-build-config"
                "--app-directory=."
                "--runtime-mode=dynamic"
                "--entrypoint=$ENTRYPOINT"
                "--working-directory=."
                "--pre-deploy-command=true"
                "--build-timeout=$DENO_BUILD_TIMEOUT"
                "--build-memory-limit=$DENO_BUILD_MEMORY_LIMIT"
                "--region=$DENO_DEPLOY_REGION"
                "--no-wait"
              )
              if [ -n "$INSTALL_COMMAND" ]; then
                create_flags+=("--install-command=$INSTALL_COMMAND")
              fi
              if [ -n "$BUILD_COMMAND" ]; then
                create_flags+=("--build-command=$BUILD_COMMAND")
              fi

              create_deno2_app() {
                set +e
                create_output="$(deno deploy create "${create_flags[@]}" "$ROOT_DIR" 2>&1)"
                create_status=$?
                set -e
                printf '%s\n' "$create_output"
                return "$create_status"
              }

              looks_like_app_quota_error() {
                printf '%s\n' "$1" |
                  grep -Eqi '(^|[^[:alnum:]_])APP_LIMIT_EXCEEDED([^[:alnum:]_]|$)'
              }

              run_deno2_quota_gc() {
                if [ "${DENO2_QUOTA_GC:-true}" != "true" ]; then
                  echo "::warning::Deno 2 quota GC is disabled; not deleting any apps."
                  return 1
                fi

                echo "Attempting Deno 2 quota GC before retrying app creation."
                # shellcheck disable=SC2016
                GC_TARGET_APP="$project" \
                GC_PROJECT="${PROJECT:-}" \
                GC_PREVIEW_PROJECT="${RESOLVED_PREVIEW_PROJECT:-${PREVIEW_PROJECT:-}}" \
                GC_PROTECTED_APPS="$DENO2_QUOTA_GC_PROTECTED_APPS" \
                GC_CANDIDATE_PREFIXES="$DENO2_QUOTA_GC_CANDIDATE_PREFIXES" \
                deno eval '
                  import process from "node:process";

                  const { Client } = await import("jsr:@deno/sandbox@0.12.0");

                  const lines = (value) =>
                    (value ?? "")
                      .split(/\r?\n/)
                      .map((line) => line.trim())
                      .filter(Boolean);

                  const target = process.env.GC_TARGET_APP ?? "";
                  const project = process.env.GC_PROJECT ?? "";
                  const previewProject = process.env.GC_PREVIEW_PROJECT ?? "";
                  const deployOrg = process.env.DENO_DEPLOY_ORG;
                  const protectedApps = new Set([
                    target,
                    project,
                    previewProject,
                    ...lines(process.env.GC_PROTECTED_APPS),
                  ].filter(Boolean));
                  const candidatePrefixes = lines(process.env.GC_CANDIDATE_PREFIXES);
                  const generatedSuffix = /^(codex|pr|pull|branch|b)(?:-|$)/;
                  const generatedAfterUosApp = /-ubq-fi-(codex|pr-|pull-|branch-|b-)/;

                  function isGeneratedCandidate(slug) {
                    if (!slug || protectedApps.has(slug)) return false;
                    if (candidatePrefixes.some((prefix) => prefix && slug.startsWith(prefix))) return true;
                    if (project && slug.startsWith(`${project}-`)) {
                      const suffix = slug.slice(project.length + 1);
                      return generatedSuffix.test(suffix);
                    }
                    return generatedAfterUosApp.test(slug) || /^pr-\d+-/.test(slug) || /-pr-\d+(?:-|$)/.test(slug);
                  }

                  const client = new Client(deployOrg ? { org: deployOrg } : {});
                  const apps = [];
                  for await (const app of await client.apps.list()) {
                    apps.push(app);
                  }

                  const candidates = apps
                    .filter((app) => isGeneratedCandidate(app.slug))
                    .sort((a, b) => {
                      const updated = new Date(a.updated_at).getTime() - new Date(b.updated_at).getTime();
                      return updated || a.slug.localeCompare(b.slug);
                    });

                  if (candidates.length === 0) {
                    console.log("No generated Deno 2 app candidates matched quota GC rules.");
                    Deno.exit(2);
                  }

                  const victim = candidates[0];
                  await client.apps.delete(victim.slug);
                  console.log(`Deleted generated Deno 2 app ${victim.slug} (${victim.id}); updated_at=${victim.updated_at}`);
                '
              }

              if ! create_deno2_app; then
                if looks_like_app_quota_error "$create_output"; then
                  run_deno2_quota_gc
                  create_deno2_app
                else
                  exit "$create_status"
                fi
              fi
            else
              echo "::error::Failed to inspect Deno Deploy app $project"
              printf '%s\n' "$probe_output"
              exit $probe_status
            fi

            tmp_env="$(mktemp)"
            tmp_build_keys="$(mktemp)"
            tmp_runtime_keys="$(mktemp)"
            trap 'rm -f "$tmp_env" "$tmp_build_keys" "$tmp_runtime_keys"' EXIT

            resolve_env_value() {
              raw_value="$1"
              if printf '%s\n' "$raw_value" | grep -Eq '^\$[A-Za-z_][A-Za-z0-9_]*$'; then
                ref_key="${raw_value#\$}"
                printf '%s' "${!ref_key:-}"
                return 0
              fi
              if printf '%s\n' "$raw_value" | grep -Eq '^\$\{[A-Za-z_][A-Za-z0-9_]*\}$'; then
                ref_key="${raw_value#\$\{}"
                ref_key="${ref_key%\}}"
                printf '%s' "${!ref_key:-}"
                return 0
              fi
              printf '%s' "$raw_value"
            }

            append_env_block() {
              block="$1"
              source_name="$2"
              context="$3"
              [ -z "$block" ] && return 0
              while IFS= read -r line; do
                line=$(printf '%s' "$line" | tr -d '\r')
                [ -z "$line" ] && continue
                if ! printf '%s\n' "$line" | grep -q '='; then
                  echo "::warning::${source_name} line missing '=': $line"
                  continue
                fi
                key="${line%%=*}"
                value="${line#*=}"
                if ! printf '%s\n' "$key" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*$'; then
                  echo "::warning::${source_name} key is not a valid env name: $key"
                  continue
                fi
                value="$(resolve_env_value "$value")"
                if [ -z "$value" ]; then
                  echo "::warning::${source_name} env $key is empty; skipping"
                  continue
                fi
                echo "::add-mask::$value"
                printf '%s=%s\n' "$key" "$value" >> "$tmp_env"
                if [ "$context" = "build" ]; then
                  printf '%s\n' "$key" >> "$tmp_build_keys"
                else
                  printf '%s\n' "$key" >> "$tmp_runtime_keys"
                fi
              done <<< "$block"
            }

            append_env_keys() {
              keys="$1"
              [ -z "$keys" ] && return 0
              while IFS= read -r key; do
                key=$(echo "$key" | tr -d '\r' | xargs)
                [ -z "$key" ] && continue
                if ! printf '%s\n' "$key" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*$'; then
                  echo "::warning::env_var_keys key is not a valid env name: $key"
                  continue
                fi
                value="${!key:-}"
                if [ -z "$value" ]; then
                  echo "::warning::Requested env $key for deploy but it is empty"
                  continue
                fi
                echo "::add-mask::$value"
                printf '%s=%s\n' "$key" "$value" >> "$tmp_env"
                printf '%s\n' "$key" >> "$tmp_runtime_keys"
              done <<< "$keys"
            }

            deno_env_output=""
            run_deno_env_command() {
              deno_env_output=""
              attempt=1
              max_attempts=5
              while true; do
                set +e
                deno_env_output="$("$@" 2>&1)"
                status=$?
                set -e
                if [ $status -eq 0 ]; then
                  return 0
                fi

                if printf '%s\n' "$deno_env_output" | grep -Eqi '(unexpected internal error|temporar|timeout|timed out|connection reset|connection closed|network error|rate limit|throttl|503|502|504)' && [ $attempt -lt $max_attempts ]; then
                  sleep_for=$(( attempt * 5 ))
                  echo "::warning::Deno Deploy env command failed transiently (attempt ${attempt}/${max_attempts}); retrying in ${sleep_for}s"
                  echo "$deno_env_output"
                  sleep "$sleep_for"
                  attempt=$(( attempt + 1 ))
                  continue
                fi

                return $status
              done
            }

            sync_env_contexts() {
              env_key="$1"
              in_build=false
              in_runtime=false
              if grep -Fxq "$env_key" "$tmp_build_keys"; then
                in_build=true
              fi
              if grep -Fxq "$env_key" "$tmp_runtime_keys"; then
                in_runtime=true
              fi

              if [ "$in_build" = "true" ] && [ "$in_runtime" != "true" ]; then
                run_deno_env_command deno deploy env update-contexts "$env_key" Build --token "$DENO_DEPLOY_TOKEN" --org "$DENO_DEPLOY_ORG" --app "$project"
              elif [ "$in_runtime" = "true" ] && [ "$in_build" != "true" ]; then
                run_deno_env_command deno deploy env update-contexts "$env_key" Production Preview --token "$DENO_DEPLOY_TOKEN" --org "$DENO_DEPLOY_ORG" --app "$project"
              else
                run_deno_env_command deno deploy env update-contexts "$env_key" --token "$DENO_DEPLOY_TOKEN" --org "$DENO_DEPLOY_ORG" --app "$project"
              fi
              status=$?
              if [ -n "$deno_env_output" ]; then
                echo "$deno_env_output"
              fi
              return $status
            }

            # New Deno Deploy runs install/build remotely, so both build_env and
            # runtime_env must be persisted to the app before the final deploy.
            append_env_block "$BUILD_ENV" "build_env" "build"
            append_env_block "$RUNTIME_ENV" "runtime_env" "runtime"
            append_env_keys "$RUNTIME_ENV_KEYS"

            if [ -s "$tmp_env" ]; then
              dedup_env="$(mktemp)"
              TMP_ENV="$tmp_env" python - <<'PY' > "$dedup_env"
          import os

          path = os.environ["TMP_ENV"]
          values = {}
          order = []
          with open(path, "r", encoding="utf-8") as handle:
              for raw in handle:
                  line = raw.rstrip("\n")
                  if not line or "=" not in line:
                      continue
                  key, value = line.split("=", 1)
                  if key in values and values[key] != value:
                      raise SystemExit(
                          f"Conflicting Deno Deploy values for {key}: build_env and runtime_env "
                          "use the same key with different values. The current deno deploy CLI "
                          "cannot sync duplicate same-name app env vars across separate contexts; "
                          "use distinct env names or the same value."
                      )
                  if key not in values:
                      order.append(key)
                  values[key] = value

          for key in order:
              print(f"{key}={values[key]}")
          PY
              mv "$dedup_env" "$tmp_env"
              while IFS= read -r env_line; do
                [ -z "$env_line" ] && continue
                env_key="${env_line%%=*}"
                env_value="${env_line#*=}"

                if run_deno_env_command deno deploy env update-value "$env_key" "$env_value" --token "$DENO_DEPLOY_TOKEN" --org "$DENO_DEPLOY_ORG" --app "$project"; then
                  update_status=0
                else
                  update_status=$?
                fi
                update_output="$deno_env_output"
                if [ $update_status -eq 0 ]; then
                  echo "$update_output"
                  sync_env_contexts "$env_key"
                  continue
                fi

                if printf '%s\n' "$update_output" | grep -qi "not found"; then
                  if run_deno_env_command deno deploy env add "$env_key" "$env_value" --secret --token "$DENO_DEPLOY_TOKEN" --org "$DENO_DEPLOY_ORG" --app "$project"; then
                    echo "$deno_env_output"
                  else
                    status=$?
                    echo "$deno_env_output"
                    exit $status
                  fi
                  sync_env_contexts "$env_key"
                elif printf '%s\n' "$update_output" | grep -qi "unexpected internal error"; then
                  echo "::warning::Deno Deploy env update failed internally for $env_key; replacing the variable."
                  echo "$update_output"

                  if run_deno_env_command deno deploy env delete "$env_key" --token "$DENO_DEPLOY_TOKEN" --org "$DENO_DEPLOY_ORG" --app "$project"; then
                    delete_status=0
                  else
                    delete_status=$?
                  fi
                  delete_output="$deno_env_output"
                  if [ $delete_status -ne 0 ] && ! printf '%s\n' "$delete_output" | grep -qi "not found"; then
                    echo "$delete_output"
                    exit $delete_status
                  fi
                  [ -n "$delete_output" ] && echo "$delete_output"
                  if run_deno_env_command deno deploy env add "$env_key" "$env_value" --secret --token "$DENO_DEPLOY_TOKEN" --org "$DENO_DEPLOY_ORG" --app "$project"; then
                    echo "$deno_env_output"
                  else
                    status=$?
                    echo "$deno_env_output"
                    exit $status
                  fi
                  sync_env_contexts "$env_key"
                else
                  echo "$update_output"
                  exit $update_status
                fi
              done < "$tmp_env"
            else
              echo "No Deno Deploy app env to sync."
            fi
            exit 0
          fi

          if [ "$ENSURE_PROJECT" != "true" ] && [ -z "$secrets_block" ]; then
            echo "Skipping project ensure/secret sync (disabled and no secrets provided)"
            exit 0
          fi

          api_base="https://dash.deno.com/api/projects"
          tmp_resp="$(mktemp)"
          http_code=$(curl -sS -o "$tmp_resp" -w "%{http_code}" \
            -H "Authorization: Bearer $DENO_DEPLOY_TOKEN" \
            "$api_base/$project" || echo "000")

          if [ "$http_code" = "404" ]; then
            if [ "$ENSURE_PROJECT" != "true" ]; then
              echo "::error::Project $project not found and ensure_project is false"
              cat "$tmp_resp" || true
              exit 1
            fi
            http_code=$(curl -sS -o "$tmp_resp" -w "%{http_code}" \
              -X POST "$api_base" \
              -H "Authorization: Bearer $DENO_DEPLOY_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"$project\"}" || echo "000")
            if [ "$http_code" -ge 300 ] || [ "$http_code" -lt 200 ]; then
              echo "::error::Failed to create project $project (HTTP $http_code)"
              cat "$tmp_resp" || true
              exit 1
            fi
            echo "Created project $project"
          elif [ "$http_code" != "200" ]; then
            echo "::error::Failed to fetch project $project (HTTP $http_code)"
            cat "$tmp_resp" || true
            exit 1
          fi
          rm -f "$tmp_resp"

      - name: Deploy to Deno Deploy
        if: steps.preflight.outputs.deploy == 'yes'
        id: deploy
        run: |
          set -euo pipefail
          mode='${{ steps.target.outputs.mode }}'
          target='${{ steps.target.outputs.project }}'

          if [ "${DEPLOY_PLATFORM:-classic}" = "deno2" ]; then
            deploy_flags=(
              "--token=$DENO_DEPLOY_TOKEN"
              "--org=$DENO_DEPLOY_ORG"
              "--app=$target"
            )
            if [ "$mode" = "production" ]; then
              deploy_flags+=("--prod")
            fi

            attempt=1
            poll_sleep=60
            start_time=$(date +%s)
            # Leave a small buffer so verify/summary steps can complete before hitting the 6h Actions limit.
            max_seconds=$(( 6 * 60 * 60 - 300 ))
            while true; do
              set +e
              output=$(deno deploy "${deploy_flags[@]}" "$ROOT_DIR" 2>&1)
              status=$?
              set -e
              if [ $status -eq 0 ]; then
                echo "$output"
                break
              fi

              now=$(date +%s)
              elapsed=$(( now - start_time ))
              remaining=$(( max_seconds - elapsed ))
              if [ $remaining -le 0 ]; then
                echo "::error::Deno Deploy transient error persisted for ~${elapsed}s; exhausted retry window (6h budget)"
                echo "$output"
                exit 1
              fi

              if printf '%s\n' "$output" | grep -Eqi '(too many deployments created per hour|rate limit|throttl|temporar|timeout|timed out|error reading a body from connection|connection reset|connection closed|network error|503|502|504)'; then
                sleep_for=$poll_sleep
                if printf '%s\n' "$output" | grep -qi "error reading a body from connection"; then
                  sleep_for=10
                fi
                if [ $sleep_for -gt $remaining ]; then
                  sleep_for=$remaining
                fi
                echo "::warning::Deno Deploy transient deploy failure (attempt ${attempt}); sleeping ${sleep_for}s (elapsed ${elapsed}s, remaining ${remaining}s)"
                echo "$output"
                sleep "$sleep_for"
                attempt=$(( attempt + 1 ))
                continue
              fi

              echo "$output"
              exit $status
            done

            project_url="https://${target}.${DENO_DEPLOY_ORG}.deno.net"
            deployment_url="$(printf '%s\n' "$output" | grep -oE 'https://[^[:space:]]+\.deno\.net' | tail -n 1 || true)"
            if [ "$mode" = "production" ] || [ -z "$deployment_url" ]; then
              deployment_url="$project_url"
            fi

            {
              echo "deployment_url=$deployment_url"
              echo "project=$target"
              echo "mode=$mode"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          deploy_flags=(
            "--project=$target"
            "--entrypoint=$ENTRYPOINT"
            "--root=$ROOT_DIR"
            "--token=$DENO_DEPLOY_TOKEN"
          )
          if [ "$mode" = "production" ]; then
            deploy_flags+=("--prod")
          fi

          # Always include entrypoint and deno.json so deployctl finds the server.
          deploy_flags+=("--include=$ENTRYPOINT")
          if [ -f "deno.json" ]; then
            deploy_flags+=("--include=deno.json")
          fi

          while IFS= read -r inc; do
            inc=$(echo "$inc" | tr -d '\r' | xargs)
            [ -z "$inc" ] && continue
            deploy_flags+=("--include=$inc")
          done <<< "$INCLUDE"

          while IFS= read -r exc; do
            exc=$(echo "$exc" | tr -d '\r' | xargs)
            [ -z "$exc" ] && continue
            deploy_flags+=("--exclude=$exc")
          done <<< "$EXCLUDE"

          while IFS= read -r key; do
            key=$(echo "$key" | tr -d '\r' | xargs)
            [ -z "$key" ] && continue
            val="${!key:-}"
            if [ -n "$val" ]; then
              deploy_flags+=("--env=${key}=${val}")
            else
              echo "::warning::Requested env $key for deploy but it is empty"
            fi
          done <<< "$RUNTIME_ENV_KEYS"

          while IFS= read -r line; do
            line=$(echo "$line" | tr -d '\r')
            [ -z "$line" ] && continue
            if ! printf '%s\n' "$line" | grep -q '='; then
              echo "::warning::runtime_env line missing '=': $line"
              continue
            fi
            deploy_flags+=("--env=$line")
          done <<< "$RUNTIME_ENV"

          attempt=1
          poll_sleep=60
          start_time=$(date +%s)
          # Leave a small buffer so verify/summary steps can complete before hitting the 6h Actions limit.
          max_seconds=$(( 6 * 60 * 60 - 300 ))
          deployment_url=""
          while true; do
            set +e
            output=$(deployctl deploy "${deploy_flags[@]}" 2>&1)
            status=$?
            set -e
            if [ $status -eq 0 ]; then
              echo "$output"
              deployment_url="$(printf '%s\n' "$output" | grep -oE "https://${target}-[A-Za-z0-9]+\\.deno\\.dev" | head -n 1 || true)"
              if [ -z "$deployment_url" ]; then
                deployment_url="$(printf '%s\n' "$output" | grep -oE "https://${target}\\.deno\\.dev" | head -n 1 || true)"
              fi
              if [ -z "$deployment_url" ]; then
                deployment_url="https://${target}.deno.dev"
              fi
              break
            fi
            if echo "$output" | grep -q "Too many deployments created per hour"; then
              now=$(date +%s)
              elapsed=$(( now - start_time ))
              remaining=$(( max_seconds - elapsed ))
              if [ $remaining -le 0 ]; then
                echo "::error::Deno Deploy rate limit persisted for ~${elapsed}s; exhausted retry window (6h budget)"
                echo "$output"
                exit 1
              fi
              sleep_for=$poll_sleep
              if [ $sleep_for -gt $remaining ]; then
                sleep_for=$remaining
              fi
              echo "::warning::Deno Deploy rate limit (attempt ${attempt}); sleeping ${sleep_for}s (elapsed ${elapsed}s, remaining ${remaining}s)"
              sleep "$sleep_for"
              attempt=$(( attempt + 1 ))
              continue
            fi
            if echo "$output" | grep -qi "error reading a body from connection"; then
              now=$(date +%s)
              elapsed=$(( now - start_time ))
              remaining=$(( max_seconds - elapsed ))
              if [ $remaining -le 0 ]; then
                echo "::error::deployctl transient network error persisted for ~${elapsed}s; exhausted retry window (6h budget)"
                echo "$output"
                exit 1
              fi

              sleep_for=10
              if [ $sleep_for -gt $remaining ]; then
                sleep_for=$remaining
              fi

              echo "::warning::deployctl transient network error (attempt ${attempt}); sleeping ${sleep_for}s (elapsed ${elapsed}s, remaining ${remaining}s)"
              sleep "$sleep_for"
              attempt=$(( attempt + 1 ))
              continue
            fi
            echo "$output"
            exit $status
          done

          if [ "$mode" = "production" ]; then
            deployment_url="https://${target}.deno.dev"
          fi

          {
            echo "deployment_url=$deployment_url"
            echo "project=$target"
            echo "mode=$mode"
          } >> "$GITHUB_OUTPUT"

      - name: Compute deployed URLs
        if: steps.preflight.outputs.deploy == 'yes'
        id: deployed_url
        env:
          MODE: ${{ steps.deploy.outputs.mode }}
          TARGET_PROJECT: ${{ steps.deploy.outputs.project }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url || '' }}
        run: |
          set -euo pipefail
          mode="${MODE:-}"
          target_project="${TARGET_PROJECT:-}"
          prod_project="${PROJECT:-}"
          deployment_url="${DEPLOYMENT_URL:-}"

          if [ "${DEPLOY_PLATFORM:-classic}" = "deno2" ]; then
            project_url="https://${target_project}.${DENO_DEPLOY_ORG}.deno.net"
          else
            project_url="https://${target_project}.deno.dev"
          fi
          router_url=""

          base=""
          if [[ "$prod_project" == *-ubq-fi ]]; then
            base="${prod_project%-ubq-fi}"
          fi

          if [ -n "$base" ]; then
            if [ "$mode" = "production" ]; then
              router_url="https://${base}.ubq.fi"
            else
              router_url="https://preview-${base}.ubq.fi"
            fi
          fi

          if [ -z "$deployment_url" ]; then
            deployment_url="$project_url"
          fi

          {
            echo "project_url=$project_url"
            echo "deployment_url=$deployment_url"
            echo "router_url=$router_url"
            echo "url=$deployment_url"
          } >> "$GITHUB_OUTPUT"

      - name: Comment deployment URL on PR
        if: steps.preflight.outputs.deploy == 'yes' && env.COMMENT_PR == 'true' && steps.deploy.outputs.mode == 'preview' && (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || '' }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
          TARGET_PROJECT: ${{ steps.deploy.outputs.project }}
          MODE: ${{ steps.deploy.outputs.mode }}
          DEPLOYMENT_URL: ${{ steps.deployed_url.outputs.deployment_url || '' }}
          PROJECT_URL: ${{ steps.deployed_url.outputs.project_url || '' }}
        run: |
          set -euo pipefail
          marker="<!-- deno-deploy-preview -->"
          project="${TARGET_PROJECT}"
          sha="${SHA}"
          deployment_url="${DEPLOYMENT_URL:-}"
          project_url="${PROJECT_URL:-}"
          if [ -z "$deployment_url" ]; then
            deployment_url="$project_url"
          fi
          url_line="${deployment_url}"
          timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          run_url="${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"

          pr_number="${PR_NUMBER:-}"
          if [ -z "$pr_number" ]; then
            pulls_url="https://api.github.com/repos/${REPO}/commits/${sha}/pulls"
            pulls_resp="$(mktemp)"
            pulls_code="$(curl -sS -o "$pulls_resp" -w "%{http_code}" -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$pulls_url" || echo "000")"
            pulls_json="$(cat "$pulls_resp" || true)"
            rm -f "$pulls_resp"
            if [ "$pulls_code" != "200" ]; then
              echo "::warning::Failed to resolve PR via $pulls_url (HTTP $pulls_code)"
            fi
            pr_number="$(
              PULLS_JSON="$pulls_json" python - <<'PY'
          import json, os

          raw = os.environ.get("PULLS_JSON", "") or "[]"
          num = ""
          try:
              data = json.loads(raw)
          except Exception:
              data = []

          if isinstance(data, list) and data:
              open_prs = [p for p in data if isinstance(p, dict) and p.get("state") == "open"]
              pr = open_prs[0] if open_prs else data[0]
              if isinstance(pr, dict):
                  num = str(pr.get("number") or "")

          print(num, end="")
          PY
            )"
          fi

          if [ -z "$pr_number" ]; then
            echo "No PR found for commit ${sha}; skipping comment."
            exit 0
          fi

          comments_url="https://api.github.com/repos/${REPO}/issues/${pr_number}/comments"

          body_path="$(mktemp)"
          existing_id="$(
            OUT_FILE="$body_path" MARKER="$marker" PROJECT="$project" URL_LINE="$url_line" SHA="$sha" MODE="$MODE" TIMESTAMP="$timestamp" RUN_URL="$run_url" REPO="$REPO" PR_NUMBER="$pr_number" python - <<'PY'
          import json, os, re, sys, urllib.request
          from urllib.error import HTTPError, URLError
          from datetime import datetime, timezone
          from html import escape

          marker = os.environ.get("MARKER", "<!-- deno-deploy-preview -->")
          project = os.environ.get("PROJECT", "")
          url_line = os.environ.get("URL_LINE", "")
          sha = os.environ.get("SHA", "")
          mode = os.environ.get("MODE", "preview")
          timestamp = os.environ.get("TIMESTAMP", "")
          run_url = os.environ.get("RUN_URL", "")
          repo = (os.environ.get("REPO", "") or "").strip()
          pr_number = (os.environ.get("PR_NUMBER", "") or "").strip()
          out_file = os.environ.get("OUT_FILE", "")

          MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"]
          MAX_SUBJECT_LEN = 140
          COMMENTS_PER_PAGE = 100
          MAX_COMMENT_PAGES = 20

          def normalize_subject(val: str) -> str:
              if not isinstance(val, str):
                  return ""
              val = val.replace("\r\n", "\n").replace("\r", "\n")
              val = val.split("\n", 1)[0].strip()
              val = re.sub(r"\s+", " ", val).strip()
              if not val:
                  return ""
              if len(val) > MAX_SUBJECT_LEN:
                  val = val[: MAX_SUBJECT_LEN - 1].rstrip() + "…"
              return val

          def normalize_url(val: str) -> str:
              if not isinstance(val, str):
                  return ""
              val = re.sub(r"\s*\(router: <[^>]+>\)", "", val).strip()
              if val.startswith("<") and val.endswith(">"):
                  val = val[1:-1].strip()
              return val

          url_line = normalize_url(url_line)

          token = (os.environ.get("GH_TOKEN", "") or "").strip()
          api_base = (
              os.environ.get("GITHUB_API_URL", "https://api.github.com") or "https://api.github.com"
          ).rstrip("/")
          commit_subject_cache = {}

          def api_get_json(url: str):
              if not token:
                  return None
              try:
                  req = urllib.request.Request(url)
                  req.add_header("Accept", "application/vnd.github+json")
                  req.add_header("X-GitHub-Api-Version", "2022-11-28")
                  req.add_header("Authorization", f"Bearer {token}")
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      raw = resp.read().decode("utf-8", errors="replace")
                  return json.loads(raw)
              except (HTTPError, URLError, TimeoutError) as e:
                  print(f"::warning::GitHub API request failed for {url}: {e}", file=sys.stderr)
                  return None
              except Exception as e:
                  print(f"::warning::GitHub API parse failed for {url}: {e}", file=sys.stderr)
                  return None

          def fetch_issue_comments() -> list:
              if not token or not repo or not pr_number:
                  return []
              all_comments = []
              for page in range(1, MAX_COMMENT_PAGES + 1):
                  url = (
                      f"{api_base}/repos/{repo}/issues/{pr_number}/comments"
                      f"?per_page={COMMENTS_PER_PAGE}&page={page}"
                  )
                  data = api_get_json(url)
                  if not isinstance(data, list):
                      break
                  all_comments.extend(data)
                  if len(data) < COMMENTS_PER_PAGE:
                      break
              return all_comments

          def fetch_commit_subject(sha_val: str) -> str:
              sha_val = (sha_val or "").strip()
              if not sha_val or not repo:
                  return ""
              cached = commit_subject_cache.get(sha_val)
              if cached is not None:
                  return cached
              subject = ""
              if token:
                  try:
                      data = api_get_json(f"{api_base}/repos/{repo}/commits/{sha_val}") or {}
                      message = ((data or {}).get("commit") or {}).get("message") or ""
                      subject = normalize_subject(message)
                  except Exception:
                      subject = ""
              commit_subject_cache[sha_val] = subject
              return subject

          def parse_projects_from_body(body: str) -> dict:
              body = body or ""
              if "\\n" in body and "\n" not in body:
                  body = body.replace("\\n", "\n")

              data_prefix = "<!-- deno-deploy-preview:data "
              data_json = ""
              has_data = False
              data_start = body.find(data_prefix)
              if data_start != -1:
                  data_start += len(data_prefix)
                  data_end = body.find("-->", data_start)
                  if data_end != -1:
                      data_json = body[data_start:data_end].strip()
                      has_data = True

              data = {}
              if has_data and data_json:
                  try:
                      data = json.loads(data_json)
                  except Exception:
                      data = {}
                      has_data = False
                  if not isinstance(data, dict):
                      data = {}
                      has_data = False

              projects = data.get("projects") if isinstance(data, dict) else None
              if not isinstance(projects, dict):
                  projects = {}

              for _, history in list(projects.items()):
                  if not isinstance(history, list):
                      continue
                  for entry in history:
                      if not isinstance(entry, dict):
                          continue
                      entry["url_line"] = normalize_url(entry.get("url_line") or "")
                      entry["msg"] = normalize_subject(entry.get("msg") or entry.get("message") or "")

              if not has_data and marker and marker in body:
                  legacy_entries = {}
                  for line in body.splitlines():
                      m = re.match(r"-\\s+`([^`]+)`:\\s*(.+)", line.strip())
                      if m:
                          legacy_entries[m.group(1)] = m.group(2).strip()

                  legacy_sha = ""
                  legacy_mode = ""
                  note_match = re.search(r"_Updated from `([^`]+)` \\(([^)]+)\\)\\._", body)
                  if note_match:
                      legacy_sha = note_match.group(1)
                      legacy_mode = note_match.group(2)

                  for p, line in legacy_entries.items():
                      if not line:
                          continue
                      projects.setdefault(p, []).append(
                          {
                              "ts": "",
                              "sha": legacy_sha,
                              "mode": legacy_mode,
                              "url_line": normalize_url(line),
                              "run_url": "",
                              "msg": "",
                          }
                      )

              return projects

          def normalize_entry(entry: dict) -> dict:
              entry = entry or {}
              return {
                  "ts": (entry.get("ts") or "").strip(),
                  "sha": (entry.get("sha") or "").strip(),
                  "mode": (entry.get("mode") or "").strip(),
                  "url_line": normalize_url(entry.get("url_line") or ""),
                  "run_url": (entry.get("run_url") or "").strip(),
                  "msg": normalize_subject(entry.get("msg") or entry.get("message") or ""),
              }

          def entry_key(entry: dict):
              url_val = normalize_url(entry.get("url_line") or "")
              if url_val:
                  return ("url", url_val)
              run_val = (entry.get("run_url") or "").strip()
              if run_val:
                  return ("run", run_val)
              sha_val = (entry.get("sha") or "").strip()
              ts_val = (entry.get("ts") or "").strip()
              if sha_val and ts_val:
                  return ("sha_ts", sha_val, ts_val)
              if sha_val:
                  return ("sha", sha_val)
              return ("raw", json.dumps(entry, sort_keys=True, separators=(",", ":")))

          comments = fetch_issue_comments()
          marker_comments = []
          for c in comments:
              if not isinstance(c, dict):
                  continue
              body = (c.get("body") or "").strip()
              if marker and marker in body:
                  cid = c.get("id")
                  if cid is None:
                      continue
                  try:
                      cid_int = int(cid)
                  except Exception:
                      continue
                  marker_comments.append({"id": cid_int, "body": body})

          marker_comments.sort(key=lambda x: x["id"])
          existing_id = str(marker_comments[-1]["id"]) if marker_comments else ""

          projects = {}
          seen = {}
          for c in marker_comments:
              parsed = parse_projects_from_body(c.get("body") or "")
              if not isinstance(parsed, dict):
                  continue
              for p, history in parsed.items():
                  if not isinstance(history, list):
                      continue
                  out = projects.setdefault(p, [])
                  seen_set = seen.setdefault(p, set())
                  for raw_entry in history:
                      if not isinstance(raw_entry, dict):
                          continue
                      normalized = normalize_entry(raw_entry)
                      key = entry_key(normalized)
                      if key in seen_set:
                          continue
                      out.append(normalized)
                      seen_set.add(key)

          if project and url_line:
              history = projects.setdefault(project, [])
              if not isinstance(history, list):
                  history = []
                  projects[project] = history
              if not history or history[-1].get("url_line") != url_line:
                  history.append(
                      {
                          "ts": timestamp,
                          "sha": sha,
                          "mode": mode,
                          "url_line": url_line,
                          "run_url": run_url,
                          "msg": "",
                      }
                  )
                  seen_set = seen.setdefault(project, set())
                  seen_set.add(entry_key(history[-1]))

          for _, history in list(projects.items()):
              if not isinstance(history, list):
                  continue
              for entry in history:
                  if not isinstance(entry, dict):
                      continue
                  sha_val = (entry.get("sha") or "").strip()
                  if sha_val and not entry.get("msg"):
                      entry["msg"] = fetch_commit_subject(sha_val)

          def format_utc(ts: str) -> str:
              if not ts:
                  return ""
              dt = None
              try:
                  if ts.endswith("Z"):
                      dt = datetime.strptime(ts, "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=timezone.utc)
                  else:
                      dt = datetime.fromisoformat(ts.replace("Z", "+00:00"))
              except Exception:
                  dt = None
              if not dt:
                  return ""
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)
              dt = dt.astimezone(timezone.utc)
              month = MONTHS[dt.month - 1] if 1 <= dt.month <= 12 else dt.strftime("%b")
              return f"{dt.day:02d} {month} {dt.hour:02d}:{dt.minute:02d}"

          def render(pdata: dict, truncated: bool) -> str:
              payload = {"version": 1, "projects": pdata}
              data_line = "<!-- deno-deploy-preview:data " + json.dumps(
                  payload, separators=(",", ":"), sort_keys=True
              ) + " -->"

              lines = [marker, data_line]

              projects_sorted = sorted(pdata.keys())
              multi_project = len(projects_sorted) > 1

              def row(entry: dict):
                  entry = entry or {}
                  ts = (entry.get("ts") or "").strip()
                  sha_val = (entry.get("sha") or "").strip()
                  sha_short = sha_val[:7] if sha_val else ""
                  url_val = normalize_url((entry.get("url_line") or "").strip())
                  run_val = (entry.get("run_url") or "").strip()
                  msg_val = normalize_subject(entry.get("msg") or "")

                  commit_href = f"commits/{sha_val}" if sha_val else ""
                  if sha_val and repo and pr_number:
                      commit_href = f"/{repo}/pull/{pr_number}/commits/{sha_val}"

                  utc = format_utc(ts)

                  # Prefer linking the timestamp to the workflow run (GitHub Actions).
                  # Fall back to the deployment URL when the run URL isn't available (legacy history).
                  timestamp_href = run_val or url_val

                  row_lines = ["  <tr>"]
                  row_lines.append(
                      '    <td><code><a href="'
                      + escape(timestamp_href, quote=True)
                      + '"><span>'
                      + escape(utc)
                      + "</span></a></code></td>"
                  )

                  message_cell = ""
                  if sha_val and commit_href:
                      message_cell += (
                          '<code><a href="'
                          + escape(commit_href, quote=True)
                          + '">'
                          + escape(sha_short)
                          + "</a></code>"
                      )
                  elif sha_short:
                      message_cell += "<code>" + escape(sha_short) + "</code>"

                  if msg_val and url_val:
                      message_cell += (
                          ' <span><a href="'
                          + escape(url_val, quote=True)
                          + '">'
                          + escape(msg_val)
                          + "</a></span>"
                      )

                  row_lines.append("    <td>" + message_cell + " </td>")
                  row_lines.append("  </tr>")
                  return row_lines

              for p in projects_sorted:
                  history = pdata.get(p) or []
                  if not isinstance(history, list) or not history:
                      continue

                  if multi_project:
                      lines.append(f"<code>{escape(str(p))}</code>")
                      lines.append("")

                  # Render newest first.
                  history_rev = list(reversed(history))
                  latest = history_rev[0]
                  previous = history_rev[1:]

                  lines.append("<table>")
                  lines.extend(row(latest))
                  lines.append("</table>")

                  if previous:
                      count = len(previous)
                      lines.append("")
                      lines.append("<details>")
                      lines.append(f"<summary><strong>Show {count} previous deployments</strong></summary>")
                      lines.append("")
                      lines.append("<table>")
                      for idx, entry in enumerate(previous):
                          lines.extend(row(entry))
                          if idx != len(previous) - 1:
                              lines.append("")
                      lines.append("</table>")
                      lines.append("")
                      lines.append("</details>")

                  lines.append("")

              if truncated:
                  lines.append("<sub>History truncated to fit GitHub comment size limits.</sub>")

              return "\n".join(lines).strip()

          MAX_BODY_CHARS = 60000
          truncated = False
          rendered = render(projects, truncated=False)
          while len(rendered) > MAX_BODY_CHARS:
              longest = None
              for p, history in projects.items():
                  if not isinstance(history, list) or len(history) <= 1:
                      continue
                  if longest is None or len(history) > len(projects[longest]):
                      longest = p
              if longest is None:
                  break
              projects[longest].pop(0)
              truncated = True
              rendered = render(projects, truncated=False)

          try:
              new_body = render(projects, truncated=truncated)
          except Exception as e:
              print(f"::warning::Failed to render PR deploy comment: {e}", file=sys.stderr)
              new_body = marker

          if out_file:
              try:
                  with open(out_file, "w", encoding="utf-8") as f:
                      f.write(new_body)
              except Exception as e:
                  print(f"::warning::Failed to write PR deploy comment body: {e}", file=sys.stderr)

          print(existing_id, end="")
          PY
          )"
          new_body="$(cat "$body_path")"
          rm -f "$body_path"

          payload="$(
            BODY="$new_body" python - <<'PY'
          import json, os
          print(json.dumps({"body": os.environ.get("BODY", "")}))
          PY
          )"

          tmp_resp="$(mktemp)"
          http_code="000"
          if [ -n "$existing_id" ]; then
            http_code="$(curl -sS -o "$tmp_resp" -w "%{http_code}" -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/issues/comments/${existing_id}" \
              -d "$payload" || echo "000")"
            if [ "$http_code" != "200" ]; then
              echo "::error::Failed to update PR comment ${existing_id} (HTTP $http_code)"
              cat "$tmp_resp" || true
              rm -f "$tmp_resp"
              exit 1
            fi
            echo "Updated PR comment ${existing_id} with ${project} -> ${url_line} (HTTP $http_code)"
          else
            http_code="$(curl -sS -o "$tmp_resp" -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$comments_url" \
              -d "$payload" || echo "000")"
            if [ "$http_code" != "201" ]; then
              echo "::error::Failed to create PR comment (HTTP $http_code)"
              cat "$tmp_resp" || true
              rm -f "$tmp_resp"
              exit 1
            fi
            new_id="$(
              RESP_FILE="$tmp_resp" python - <<'PY'
          import json, os

          path = os.environ.get("RESP_FILE", "")
          try:
              with open(path, "r", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception:
              data = {}

          print(str((data or {}).get("id") or ""), end="")
          PY
            )"
            echo "Created PR comment ${new_id:-<unknown>} for ${project} -> ${url_line} (HTTP $http_code)"
          fi
          rm -f "$tmp_resp"

      - name: Verify deployment
        if: steps.preflight.outputs.deploy == 'yes' && env.VERIFY_URL == 'true'
        id: verify
        continue-on-error: true
        run: |
          set -euo pipefail
          url='${{ steps.deployed_url.outputs.deployment_url }}'
          if [ -z "$url" ]; then
            if [ "${DEPLOY_PLATFORM:-classic}" = "deno2" ]; then
              url="https://${{ steps.deploy.outputs.project }}.${DENO_DEPLOY_ORG}.deno.net"
            else
              url="https://${{ steps.deploy.outputs.project }}.deno.dev"
            fi
          fi
          codes_ok="200"
          status="fail"
          http_code="000"
          for _ in 1 2 3; do
            http_code=$(curl -sS -L -o /dev/null -w "%{http_code}" "$url" || echo "000")
            if echo "$codes_ok" | grep -q "\b$http_code\b"; then
              status="ok"
              break
            fi
            sleep 5
          done
          echo "http_code=$http_code" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" != "ok" ]; then
            echo "::error::Deployment probe returned HTTP $http_code at $url"
          fi

      - name: Debug fetch paths (optional)
        if: steps.preflight.outputs.deploy == 'yes' && env.DEBUG_FETCH_PATHS != ''
        run: |
          set -euo pipefail
          base='${{ steps.deployed_url.outputs.deployment_url }}'
          if [ -z "$base" ]; then
            if [ "${DEPLOY_PLATFORM:-classic}" = "deno2" ]; then
              base="https://${{ steps.deploy.outputs.project }}.${DENO_DEPLOY_ORG}.deno.net"
            else
              base="https://${{ steps.deploy.outputs.project }}.deno.dev"
            fi
          fi
          ok_codes="200 301 302 304 308"
          # Retry a few times for transient deployctl/edge blips (occasionally returns 5xx/000 right after deploy).
          retryable_codes="000 404 429 500 502 503 504 599"
          max_attempts=6
          misses=()
          summary=""

          # Give the edge a moment to pick up the new deployment before probing assets.
          sleep 10

          while IFS= read -r raw; do
            raw=$(echo "$raw" | tr -d '\r' | xargs)
            [ -z "$raw" ] && continue
            case "$raw" in
              http://*|https://*) url="$raw" ;;
              /*) url="${base%/}$raw" ;;
              *) url="${base%/}/$raw" ;;
            esac
            attempt=1
            http_code="000"
            while true; do
              http_code=$(curl -sS -o /dev/null -w "%{http_code}" "$url" || echo "000")
              if echo "$ok_codes" | grep -q "\b$http_code\b"; then
                break
              fi
              if echo "$retryable_codes" | grep -q "\b$http_code\b" && [ $attempt -lt $max_attempts ]; then
                sleep $(( attempt * 2 ))
                attempt=$(( attempt + 1 ))
                continue
              fi
              break
            done

            if echo "$ok_codes" | grep -q "\b$http_code\b"; then
              note=""
              if [ $attempt -gt 1 ]; then
                note=" after ${attempt} attempts"
              fi
              summary+="- [ok] $url (HTTP $http_code${note})\n"
            else
              summary+="- [miss] $url (HTTP $http_code after ${attempt} attempts)\n"
              misses+=("$url")
            fi
          done <<< "$DEBUG_FETCH_PATHS"

          {
            echo "### Debug fetch"
            echo ""
            printf "%b" "$summary"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ${#misses[@]} -gt 0 ] && [ "${DEBUG_FETCH_FAIL:-false}" = "true" ]; then
            echo "::error::Debug fetch failures: ${misses[*]}"
            exit 1
          fi

      - name: Summary
        if: steps.preflight.outputs.deploy == 'yes'
        run: |
          mode='${{ steps.deploy.outputs.mode }}'
          project='${{ steps.deploy.outputs.project }}'
          deployment_url="${{ steps.deployed_url.outputs.deployment_url || '' }}"
          project_url="${{ steps.deployed_url.outputs.project_url || '' }}"
          router_url="${{ steps.deployed_url.outputs.router_url || '' }}"
          http="${{ steps.verify.outputs.http_code || '' }}"
          status="${{ steps.verify.outputs.status || '' }}"
          {
            echo "### Deno Deploy"
            echo ""
            echo "- Platform: ${DEPLOY_PLATFORM:-classic}"
            echo "- Mode: ${mode:-unknown}"
            echo "- Project: ${project}"
            if [ -n "$router_url" ]; then echo "- Router URL: ${router_url}"; fi
            if [ -n "$deployment_url" ]; then echo "- Deployment URL: ${deployment_url}"; fi
            if [ -n "$project_url" ]; then echo "- Project URL: ${project_url}"; fi
            if [ -n "$http" ]; then
              echo "- HTTP: ${http} (${status})"
            fi
            echo "- Ref: ${GITHUB_REF##*/}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on probe failure
        if: steps.preflight.outputs.deploy == 'yes' && env.VERIFY_URL == 'true'
        run: |
          status='${{ steps.verify.outputs.status || '' }}'
          http='${{ steps.verify.outputs.http_code || '' }}'
          url='${{ steps.deployed_url.outputs.deployment_url || '' }}'
          if [ "$status" != "ok" ]; then
            echo "::error::Deployment probe failed with HTTP ${http:-unknown} at ${url:-<missing url>}"
            exit 1
          fi
